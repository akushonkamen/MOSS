[tool.poetry]
name = "moss"
version = "0.1.0"
description = "MOSS - 智能语音助手系统"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
websockets = "^12.0"
pydantic = "^2.5.3"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
celery = "^5.3.6"
redis = "^5.0.1"
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
protobuf = "^4.25.2"
paho-mqtt = "^1.6.1"
loguru = "^0.7.2"
python-dotenv = "^1.0.0"
aiohttp = "^3.9.3"
pydantic-settings = "^2.1.0"
zeroconf = "^0.131.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.4"
black = "^24.1.1"
ruff = "^0.1.14"
mypy = "^1.8.0"
pre-commit = "^3.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
select = ["E", "F", "B", "I"]
line-length = 88

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = [".", "src"] 